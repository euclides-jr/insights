services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insights}
      POSTGRES_DB: ${POSTGRES_DB:-insights}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insights} -d ${POSTGRES_DB:-insights}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://insights:insights@db:5432/insights}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
